<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Trading Application - Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
    }

    .app-bar {
      background-color: #1976d2;
      color: white;
      padding: 16px 24px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 64px);
      padding: 20px;
    }

    .login-box {
      background-color: white;
      padding: 32px;
      border-radius: 8px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #333;
    }

    .login-box label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #125ea4;
    }

    .login-links {
      text-align: center;
      margin-top: 16px;
    }

    .login-links a {
      display: inline-block;
      margin: 4px 8px;
      color: #1976d2;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="app-bar">
    My Trading Application
  </div>

  <div class="container">
    <div class="login-box">
      <h2>Login</h2>
      <form>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" />
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" />
        <button type="submit">Login</button>
      </form>
      <div class="login-links">
        <a href="#">Forgot Password?</a>
        <a href="#">New User?</a>
      </div>
    </div>
  </div>

</body>
</html>
